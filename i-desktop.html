// --- оконный менеджер ---
const diplomaViewer = $('diploma-viewer');
const diplomaBar = diplomaViewer.querySelector('header');
function placeDiploma(left, top) {
  const bounds = diplomaViewer.getBoundingClientRect();
  const style = diplomaViewer.style;
  style.margin = '0';
  style.inset = 'auto';
  style.left = Math.max(0, Math.min(innerWidth - bounds.width, left)) + 'px';
  style.top = Math.max(0, Math.min(innerHeight - bounds.height, top)) + 'px';
}
let diplomaDrag;
diplomaBar.onpointerdown = e => {
  if (!e.isPrimary || e.button !== 0 || e.target.closest('button')) return;
  const r = diplomaViewer.getBoundingClientRect();
  diplomaDrag = {id:e.pointerId, dx:e.clientX-r.left, dy:e.clientY-r.top};
  diplomaBar.setPointerCapture(e.pointerId);
};
diplomaBar.onpointermove = e => {
  if (e.pointerId === diplomaDrag?.id) placeDiploma(e.clientX-diplomaDrag.dx,e.clientY-diplomaDrag.dy);
};
diplomaBar.onlostpointercapture = () => { diplomaDrag = null; };
window.addEventListener('resize', () => {
  if (diplomaViewer.open && diplomaViewer.style.left) {
    const r = diplomaViewer.getBoundingClientRect();
    placeDiploma(r.left,r.top);
  }
});
function setDiplomaZoom(full) {
  const sheet = diplomaViewer.querySelector('.paint-sheet');
  sheet.classList.toggle('zoomed',full);
  sheet.scrollTo(0,0);
  $('paint-zoom').setAttribute('aria-pressed',String(full));
  $('paint-scale').textContent = full ? 'Масштаб 100 %' : 'По размеру окна';
}
$('paint-zoom').onclick = () => setDiplomaZoom($('paint-zoom').getAttribute('aria-pressed') !== 'true');
$('wins').addEventListener('click', event => {
  const preview = event.target.closest('.diploma-preview');
  if (!preview) return;
  const year = preview.dataset.year;
  $('diploma-title').textContent = 'Диплом-' + year + '.jpg — Paint';
  setDiplomaZoom(false);
  const image = diplomaViewer.querySelector('img');
  image.src = `desktop-assets/diploma-${year}.jpg`;
  image.alt = 'Диплом за ' + year + ' год';
  preview.focus({preventScroll:true});
  diplomaViewer.removeAttribute('style');
  diplomaViewer.showModal();
});
diplomaViewer.addEventListener('click', event => {
  if (event.target !== diplomaViewer) return;
  const r = diplomaViewer.getBoundingClientRect();
  if (event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom) diplomaViewer.close();
});
function focusWin(id) {
  const w = open[id];
  if (!w || (w.el.classList.contains('active') && !w.el.classList.contains('min'))) return;
  Object.values(open).forEach(win => win.el.classList.remove('active'));
  w.el.style.zIndex = ++z;
  w.el.classList.remove('min');
  w.el.classList.add('active');
  tasks();
}
window.addEventListener('message', e => {
  const frame = open.integ?.el.querySelector('.flow-app');
  if (frame && e.source === frame.contentWindow && e.data === 'flow:focus') focusWin('integ');
});
function openApp(id) {
  menuState(false);
  if (open[id]) {
    open[id].restartTimer?.();
    return focusWin(id);
  }
  const a = APPS[id], n = Object.keys(open).length;
  const el = document.createElement('div'); el.className = 'win';
  el.classList.add(tools[id] ? 'placeholder-window' : 'info-window');
  if (id === 'integ') {
    el.classList.add('integration-window');
    el.style.cssText = 'left:clamp(12px,4.6vw,88px);top:12px;width:calc(100% - clamp(12px,4.6vw,88px) - 10px);height:calc(100% - var(--bar) - 24px)';
  } else if (id === 'exp') {
    el.classList.add('experience-window');
  } else el.style.cssText = `width:${Math.min(a.w, innerWidth - 20)}px;height:${Math.min(a.h, innerHeight - 70)}px;left:${Math.max(0, (innerWidth-Math.min(a.w,innerWidth-20))/2 + ((n%5)-2)*9)}px;top:${Math.max(0,(innerHeight-54-Math.min(a.h,innerHeight-70))/2 + ((n%5)-2)*4)}px`;
  el.innerHTML = `<div class="tb"><div class="titlebar-caption">${art(id)}<span class="t">${a.t}</span></div><button class="m" title="Свернуть" aria-label="Свернуть">−</button><button class="x" title="Развернуть" aria-label="Развернуть">□</button><button class="c" title="Закрыть" aria-label="Закрыть">×</button></div><div class="body"></div>`;
  $('wins').appendChild(el);
  const body = el.querySelector('.body');
  const content = tools[id] ? `<div class="smile">${toolSmiles[id]}</div>` : render[id](body);
  if (typeof content === 'string') body.innerHTML = content;
  open[id] = { el };
  const [m, x, c] = el.querySelectorAll('.tb button');
  let closeTimer;
  const closeWindow = () => {
    clearTimeout(closeTimer);
    el.remove();
    delete open[id];
    activateTop();
  };
  c.onclick = closeWindow;
  if (tools[id]) {
    open[id].restartTimer = () => {
      clearTimeout(closeTimer);
      closeTimer = setTimeout(closeWindow, 1000);
    };
    open[id].restartTimer();
  }
  m.onclick = () => { el.classList.add('min'); activateTop(); };
  x.onclick = () => {
    const maximized = el.classList.toggle('max');
    x.textContent = maximized ? '❐' : '□';
    x.title = maximized ? 'Восстановить' : 'Развернуть';
    x.setAttribute('aria-label',x.title);
  };
  el.addEventListener('pointerdown', () => focusWin(id));
  // перетаскивание
  const caption = el.querySelector('.titlebar-caption');
  caption.ondblclick = () => { if (getComputedStyle(x).display !== 'none') x.click(); };
  caption.addEventListener('pointerdown', e => {
    if (!e.isPrimary || e.button !== 0 || el.classList.contains('max') || getComputedStyle(caption).touchAction !== 'none') return;
    const dx = e.clientX - el.offsetLeft, dy = e.clientY - el.offsetTop;
    caption.setPointerCapture(e.pointerId);
    caption.style.cursor = 'grabbing';
    const mv = ev => { el.style.left = Math.max(-200, Math.min(innerWidth - 80, ev.clientX - dx)) + 'px'; el.style.top = Math.max(0, Math.min(innerHeight - 80, ev.clientY - dy)) + 'px'; };
    caption.addEventListener('pointermove', mv);
    caption.addEventListener('lostpointercapture', () => {
      caption.removeEventListener('pointermove', mv);
      caption.style.cursor = '';
    }, {once:true});
  });
  focusWin(id);
}
function activateTop() {
  const visible = Object.entries(open).filter(([,w]) => !w.el.classList.contains('min'));
  visible.sort((a,b) => b[1].el.style.zIndex-a[1].el.style.zIndex);
  if (visible.length) focusWin(visible[0][0]);
  else tasks();
}
const pinned=['integ','chrome','phpstorm','docker'];
function tasks() {
  const ids = [...new Set([...pinned, ...Object.keys(open)])];
  $('tasks').innerHTML = ids.map(id => {
    const el = open[id]?.el;
    const active = el && !el.classList.contains('min') && el.classList.contains('active');
    return `<button title="${APPS[id].t}" aria-label="${APPS[id].t}" class="${el?'running':''} ${active?'on':''}" data-id="${id}">${art(id)}</button>`;
  }).join('');
}
$('tasks').onclick = e => {
  const b=e.target.closest('button'); if(!b) return;
  const id=b.dataset.id, el=open[id]?.el;
  if(el && !el.classList.contains('min') && el.classList.contains('active')) {
    el.classList.add('min'); activateTop();
  } else openApp(id);
};
$('icons').innerHTML = Object.entries(APPS).map(([id,a]) =>
  `<button class="ico" data-id="${id}">${art(id)}<span>${a.t}</span></button>`).join('');
const desktop = $('icons');
const shortcuts = [...desktop.children];
const layoutKey = 'portfolio.desktop.layout.v1';
let layouts = {};
try {
  const saved = JSON.parse(localStorage.getItem(layoutKey));
  if (saved && typeof saved === 'object') layouts = saved;
} catch { /* The desktop also works when storage is unavailable. */ }

function layout() {
  const mode = getComputedStyle(desktop).getPropertyValue('--shortcut-layout').trim();
  return layouts[mode] ||= {};
}
function canvasSize() {
  // Measure the original grid, including rows outside a short viewport.
  return {
    width: Math.max(desktop.clientWidth, ...shortcuts.map(b => b.offsetLeft + b.offsetWidth)),
    height: Math.max(desktop.clientHeight, ...shortcuts.map(b => b.offsetTop + b.offsetHeight))
  };
}
function place(button, x, y) {
  button.style.transform = `translate(${x - button.offsetLeft}px,${y - button.offsetTop}px)`;
}
function restoreLayout() {
  const size = canvasSize();
  const positions = layout();
  for (const b of shortcuts) {
    const pos = positions[b.dataset.id];
    if (pos && Number.isFinite(pos.x) && Number.isFinite(pos.y)) {
      place(b, pos.x * (size.width - b.offsetWidth), pos.y * (size.height - b.offsetHeight));
      b.style.zIndex = pos.order;
    } else {
      b.style.transform = '';
      b.style.zIndex = '';
    }
  }
}
let drag = null, suppressClick = null;
desktop.addEventListener('pointerdown', e => {
  const b = e.target.closest('.ico');
  if (!b || !e.isPrimary || e.button !== 0 || drag) return;
  suppressClick = null;
  const rect = b.getBoundingClientRect();
  drag = {b, id:e.pointerId, startX:e.clientX, startY:e.clientY,
    grabX:e.clientX - rect.left, grabY:e.clientY - rect.top, size:canvasSize(), moved:false};
  b.setPointerCapture(e.pointerId);
});
function moveIcon(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const {b,size} = drag;
  if (!drag.moved) {
    if (Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) < 5) return;
    drag.moved = true;
    b.classList.add('dragging');
    b.style.zIndex = 1 + Math.max(0, ...shortcuts.map(icon => Number(icon.style.zIndex)));
  }
  const rect = desktop.getBoundingClientRect();
  drag.x = Math.max(0, Math.min(size.width - b.offsetWidth, e.clientX - rect.left + desktop.scrollLeft - drag.grabX));
  drag.y = Math.max(0, Math.min(size.height - b.offsetHeight, e.clientY - rect.top + desktop.scrollTop - drag.grabY));
  place(b, drag.x, drag.y);
}
desktop.addEventListener('pointermove', moveIcon);
desktop.addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return;
  moveIcon(e);
  const {b,moved,x,y,size} = drag;
  drag = null;
  if (!moved) return;
  suppressClick = b;
  b.classList.remove('dragging');
  layout()[b.dataset.id] = {x:x / Math.max(1,size.width - b.offsetWidth),
    y:y / Math.max(1,size.height - b.offsetHeight), order:Number(b.style.zIndex)};
  try { localStorage.setItem(layoutKey, JSON.stringify(layouts)); } catch {}
});
function cancelDrag() {
  if (drag) {
    drag.b.classList.remove('dragging');
    drag = null;
  }
  restoreLayout();
}
desktop.addEventListener('lostpointercapture', e => { if (drag?.id === e.pointerId) cancelDrag(); });
new ResizeObserver(cancelDrag).observe(desktop);
restoreLayout();
desktop.onclick = e => {
  const b = e.target.closest('button');
  if (b && (e.detail === 0 || b !== suppressClick)) openApp(b.dataset.id);
  suppressClick = null;
};

$('menu').innerHTML = '<input id="query" type="search" aria-label="Поиск приложений" placeholder="Найти приложение"><div id="results"></div>';
function menuItems() {
  const query=$('query').value.trim().toLocaleLowerCase('ru');
  let html='';
  for (const [heading, ids] of [['Портфолио',Object.keys(folders)],['Приложения',Object.keys(tools)]]) {
    const matches=ids.filter(id=>APPS[id].t.toLocaleLowerCase('ru').includes(query));
    if(matches.length) html+=`<h2>${heading}</h2><div class="menu-grid">` +
      matches.map(id=>`<button data-id="${id}">${art(id)}${APPS[id].t}</button>`).join('') + '</div>';
  }
  $('results').innerHTML=html || '<p>Приложения не найдены</p>';
}
function menuState(on, focusSearch = false) {
  const menu = $('menu');
  const wasOpen = menu.classList.contains('on');
  menu.classList.toggle('on',on);
  $('start').setAttribute('aria-expanded',String(on));
  if (on && !wasOpen) {
    $('query').value = '';
    menuItems();
  }
  if (on && focusSearch) $('query').focus({preventScroll:true});
}
$('start').onclick=()=>menuState(!$('menu').classList.contains('on'), matchMedia('(hover:hover) and (pointer:fine)').matches);
$('find').onclick=()=>menuState(true, true);
$('query').oninput=menuItems;
$('query').onkeydown=e=>{if(e.key==='Enter') $('results').querySelector('button')?.click();};
$('menu').onclick=e=>{const b=e.target.closest('[data-id]'); if(b) openApp(b.dataset.id);};
const isWindowBackdrop = target => !target.closest('.win, #menu, dialog, button');
let backdropPress = null;
document.addEventListener('pointerdown', e => {
  if (e.isPrimary) {
    backdropPress = e.button === 0 && isWindowBackdrop(e.target)
      ? { id: e.pointerId, x: e.clientX, y: e.clientY }
      : null;
  }
});
document.addEventListener('pointerup', e => {
  if (backdropPress?.id !== e.pointerId) return;
  const { x, y } = backdropPress;
  backdropPress = null;
  if (isWindowBackdrop(e.target) && Math.hypot(e.clientX - x, e.clientY - y) <= 8) {
    if ($('menu').classList.contains('on')) menuState(false);
    else $('wins').querySelector('.info-window.active:not(.min) .tb .c')?.click();
  }
});
document.addEventListener('pointercancel', e => {
  if (backdropPress?.id === e.pointerId) backdropPress = null;
});
document.addEventListener('click', e => {
  if ($('menu').classList.contains('on') && !e.target.closest('#menu,#start,#find')) menuState(false);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape' && $('menu').classList.contains('on')){menuState(false);$('start').focus();}});
$('showDesk').onclick=()=>{
  Object.values(open).forEach(w=>w.el.classList.add('min'));menuState(false);tasks();
};
function clock() {
  const now=new Date();
  $('clock').innerHTML=now.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'<br>'+now.toLocaleDateString('ru-RU');
}
const viewport = window.visualViewport;
if (viewport) {
  const fitPhoneViewport = () => {
    if (Math.abs(viewport.scale - 1) > .01) return;
    const style = document.documentElement.style;
    const top = Math.max(0, viewport.pageTop);
    if (Math.abs(viewport.width - innerWidth) <= 1 && (Math.abs(viewport.height - innerHeight) > 1 || top > 1)) {
      style.setProperty('--phone-viewport-height', `${viewport.height}px`);
      style.setProperty('--phone-viewport-top', `${top}px`);
    } else {
      style.removeProperty('--phone-viewport-height');
      style.removeProperty('--phone-viewport-top');
    }
  };
  viewport.addEventListener('resize', fitPhoneViewport);
  viewport.addEventListener('scroll', fitPhoneViewport);
  window.addEventListener('resize', fitPhoneViewport);
  fitPhoneViewport();
}
clock();setInterval(clock,1000);tasks();
</script>
</body>
</html>
