<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выбор интеграций для резюме</title>
<style>
  :root{color-scheme:dark;--bg:#090f19;--surface:#101a29;--line:#29384c;--text:#edf4fc;--muted:#afbdd1}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
  main{max-width:980px;margin:0 auto;padding:24px clamp(12px,3vw,32px) 64px}
  a{color:#b8dbff;text-underline-offset:3px}h1{margin:16px 0 5px;font-size:clamp(26px,4vw,40px);line-height:1.13}header p{margin:7px 0 18px;color:var(--muted)}
  .bar{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:10px 12px;background:#172435;border:1px solid #40536b;border-radius:8px}
  output{font-variant-numeric:tabular-nums}button,select,textarea{font:inherit}button,select{min-height:40px;padding:6px 10px;border-radius:6px;cursor:pointer}
  button{border:0;background:#d2e9ff;color:#0a2138;font-weight:650}button:hover{background:#e7f4ff}select,textarea{background:var(--surface);border:1px solid var(--line);color:var(--text)}
  :focus-visible{outline:2px solid #fff;outline-offset:3px}.jump{margin-top:18px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;color:var(--muted)}
  section{margin-top:28px}h2{font-size:19px;line-height:1.3;margin:0 0 9px;scroll-margin-top:110px}h2 small{color:var(--muted);margin-left:6px;font-weight:400;font-size:14px}
  .rows{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
  .entry{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:start;gap:4px 12px;padding:12px 14px;cursor:pointer}
  .entry+.entry{border-top:1px solid var(--line)}.entry:hover,.entry:focus-within{background:#1a2739}
  input{accent-color:var(--role);width:19px;height:19px;margin:2px 0 0;cursor:pointer}.entry strong{overflow-wrap:anywhere}.entry input:not(:checked)~strong{text-decoration:line-through;color:var(--muted)}
  .role{color:var(--role);font-size:12px;display:inline-flex;align-items:center;gap:6px}.role:before{content:'';width:16px;border-top:2px solid}.team .role:before{border-top-style:dashed}
  .task{grid-column:2/-1;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
  #feedback:empty,#storage-note:empty{display:none}#storage-note,#feedback{color:var(--muted)}textarea{display:block;width:100%;padding:10px;margin:8px 0}
  @media(max-width:710px){.entry{grid-template-columns:22px minmax(0,1fr)}.role,.task{grid-column:2}.bar{font-size:14px}}
</style>
</head>
<body>
<main>
  <header><a href="integrations.html">← К схеме интеграций</a>
    <h1>Интеграции для резюме</h1>
    <p><span id="scope"></span> Оставь галочки у тех задач, которые хочешь показать в резюме. Затем скопируй выбор и отправь его в чат.</p>
  </header>
  <div class="bar"><output id="count" aria-live="polite"></output><button id="copy" type="button">Скопировать выбор</button></div>
  <p id="storage-note" role="status"></p><p id="feedback" role="status"></p>
  <div id="manual" hidden><label for="result">Текст для отправки в чат</label><textarea id="result" rows="8" readonly></textarea></div>
  <label class="jump">Перейти к категории <select id="jump"><option value="">Выбери категорию</option></select></label>
  <div id="catalog"></div>
</main>
<script src="project-integrations.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const storageKey = 'portfolio.integration-review.excluded.v1';
  let excluded = new Set();
  const storageWarning = 'Браузер не сохраняет черновик. Скопируй выбор перед закрытием страницы.';
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (Array.isArray(saved)) excluded = new Set(saved);
  } catch { $('storage-note').textContent = storageWarning; }

  const choices = [];
  function addChoice(container, item, role, task) {
    const key = `${item.id}/${role}`;
    const row = document.createElement('label');
    row.className = `entry ${role}`;
    row.style.setProperty('--role', integrationRoles[role].color);
    const input = document.createElement('input');
    input.type = 'checkbox'; input.value = key; input.checked = !excluded.has(key);
    const name = document.createElement('strong'); name.textContent = item.name;
    const badge = document.createElement('span'); badge.className = 'role'; badge.textContent = integrationRoles[role].label;
    const details = document.createElement('span'); details.className = 'task'; details.textContent = task;
    row.append(input, name, badge, details); container.append(row);
    choices.push({item, role, input});
  }
  for (const [cat, category] of Object.entries(projectCatalog.categories)) {
    const items = projectCatalog.integrations.filter(item => item.cat === cat);
    if (!items.length) continue;
    const section = document.createElement('section');
    const title = document.createElement('h2'); title.id = 'group-' + cat; title.tabIndex = -1; title.textContent = category;
    const total = document.createElement('small'); total.textContent = String(items.length); title.append(total);
    const rows = document.createElement('div'); rows.className = 'rows';
    for (const item of items) {
      for (const [role, task] of Object.entries(item.contributions)) addChoice(rows, item, role, task);
    }
    section.append(title, rows); $('catalog').append(section);
    $('jump').add(new Option(category, title.id));
  }
  $('scope').textContent = `Сервисов в каталоге — ${projectCatalog.integrations.length}.`;
  $('jump').onchange = e => {
    const title = $(e.target.value);
    if (title) { title.focus({preventScroll:true}); title.scrollIntoView({block:'start'}); }
    e.target.selectedIndex = 0;
  };
  function updateCount() {
    const kept = choices.filter(choice => choice.input.checked).length;
    $('count').textContent = `Оставить ${kept} из ${choices.length} · Убрать ${choices.length - kept}`;
  }
  updateCount();
  $('catalog').onchange = e => {
    const input = e.target;
    if (input.checked) excluded.delete(input.value); else excluded.add(input.value);
    try { localStorage.setItem(storageKey, JSON.stringify([...excluded])); }
    catch { $('storage-note').textContent = storageWarning; }
    $('manual').hidden = true; $('feedback').textContent = ''; updateCount();
  };
  function selectionText() {
    const lines = ['Мой выбор интеграций для резюме'];
    for (const [keep, action] of [[true, 'Оставить'], [false, 'Убрать']]) {
      const group = choices.filter(choice => choice.input.checked === keep);
      lines.push('', `${action} (${group.length})`);
      for (const [key, role] of Object.entries(integrationRoles)) {
        const names = group.filter(choice => choice.role === key).map(choice => choice.item.name);
        if (names.length) lines.push(role.label, ...names.map(name => `• ${name}`));
      }
    }
    return lines.join('\n');
  }
  $('copy').onclick = async () => {
    const text = selectionText();
    try {
      await navigator.clipboard.writeText(text);
      $('manual').hidden = true; $('feedback').textContent = 'Выбор скопирован.';
    } catch {
      $('manual').hidden = false; $('result').value = text; $('result').focus(); $('result').select();
      $('feedback').textContent = 'Текст выделен. Скопируй его через меню браузера или Ctrl+C.';
    }
  };
</script>
</body>
</html>
